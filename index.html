<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProfitPal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #1f2937;
      padding: 20px 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .calculate {
      background: #2563eb;
      color: white;
    }

    .reset {
      background: #e5e7eb;
      color: #111827;
    }

    .result-box {
      display: grid;
      gap: 12px;
    }

    .result {
      background: #f8fafc;
      padding: 14px;
      border-radius: 8px;
    }

    .result-title {
      font-size: 14px;
      color: #6b7280;
    }

    .result-value {
      font-size: 20px;
      font-weight: bold;
      margin-top: 4px;
    }

    #profit {
      font-size: 24px;
    }

    .history-item {
      background: #f8fafc;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      padding: 8px;
      margin-top: 8px;
      font-size: 13px;
    }

    .clear-btn {
      background: #6b7280;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>ProfitPal</h1>
    <p class="subtitle">Calculate your profit easily</p>

    <div class="card">

      <label for="buyingPrice">Buying Price:</label>
      <input type="number" id="buyingPrice" placeholder="Enter buying price">

      <label for="sellingPrice">Selling Price:</label>
      <input type="number" id="sellingPrice" placeholder="Enter selling price">

      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" placeholder="Enter quantity">

      <label for="expenses">Expenses:</label>
      <input type="number" id="expenses" placeholder="Enter expenses">

      <button class="calculate" onclick="calculateProfit()">Calculate Profit</button>
      <button class="reset" onclick="resetCalculator()">Reset</button>

    </div>

    <div class="card">

      <h2>Results</h2>

      <div class="result-box">

        <div class="result">
          <div class="result-title">Revenue</div>
          <div class="result-value" id="revenue">0.00</div>
        </div>

        <div class="result">
          <div class="result-title">Total Cost</div>
          <div class="result-value" id="totalCost">0.00</div>
        </div>

        <div class="result">
          <div class="result-title">Profit</div>
          <div class="result-value" id="profit">0.00</div>
        </div>

        <div class="result">
          <div class="result-title">Profit Margin</div>
          <div class="result-value" id="margin">0.00%</div>
        </div>

      </div>

    </div>

    <div class="card">

      <h2>Calculation History</h2>

      <ul id="history"></ul>

      <button class="clear-btn" onclick="clearHistory()">Clear History</button>

    </div>

  </div>
